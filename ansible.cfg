[defaults]
# Project-local collections first, then EE system path
# This ensures acme.sap_migration FQCN roles resolve when running inside AAP
collections_path = collections:/usr/share/ansible/collections
roles_path = roles
host_key_checking = False
stdout_callback = ansible.builtin.default

[callback_default]
result_format = yaml

[inventory]
enable_plugins = ansible.builtin.script, ansible.builtin.host_list, ansible.builtin.yaml, azure.azcollection.azure_rm, constructed
