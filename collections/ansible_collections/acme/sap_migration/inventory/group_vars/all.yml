---
# Global migration variables — override via AAP Survey or extra-vars.

migration_name: sap-migration-demo
migration_phase: discovery

# Azure source
azure_subscription_id: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') | default('', true) }}"
azure_resource_group: "{{ lookup('env', 'AZURE_RESOURCE_GROUP') | default('', true) }}"
azure_location: eastus
# azure_rm_virtualmachine_info tags must be a list of "key:value" strings
azure_vm_tag_filter:
  - "sap-system:{{ sap_sid | lower }}"

# GCP target
gcp_project: "{{ lookup('env', 'GCP_PROJECT') | default('', true) }}"
gcp_region: us-central1
gcp_zone: us-central1-a
gcp_cred_kind: "{{ lookup('env', 'GCP_AUTH_KIND') | default('serviceaccount', true) }}"
# AAP custom credential injects GOOGLE_APPLICATION_CREDENTIALS; local runs use GCP_SERVICE_ACCOUNT_FILE
gcp_cred_file: >-
  {{
    lookup('env', 'GOOGLE_APPLICATION_CREDENTIALS')
    | default(lookup('env', 'GCP_SERVICE_ACCOUNT_FILE'), true)
    | default('', true)
  }}
gcp_service_account_file_param: >-
  {{ gcp_cred_file if (gcp_cred_kind == 'serviceaccount' and gcp_cred_file | length > 0) else omit }}
gcp_network_name: sap-migration-vpc
gcp_subnet_name: sap-migration-subnet
gcp_subnet_cidr: 10.20.0.0/16
gcp_user: cloud-user
gcp_ssh_key_file: "{{ lookup('env', 'GCP_SSH_PUB_FILE') | default(lookup('env', 'HOME') + '/.ssh/id_rsa.pub', true) }}"

# Database platform: db2 | hana (drives profile, playbooks 05/07/08/10, Day 2 checks)
sap_database_type: db2

# SAP identity (must match source for homogeneous system copy)
sap_sid: PRD
sap_instance_nr: "00"
sap_hana_instance_nr: "00"
sap_domain: sap.local

# IBM Db2 (when sap_database_type=db2)
sap_db2_instance: db2inst1
sap_db2_port: 50000
sap_db2_database: "{{ sap_sid }}"
sap_db2_export_path: "/db2/{{ sap_db2_instance }}/export"
sap_db2_swpm_product_catalog_id: "NW_ABAP_S4HANA:NETWEAVER/APPSRV"
sap_db2_swpm_inifile_dir: "{{ lookup('env', 'SAP_SWPM_INIFILE_DIR') | default('/sapmedia/SWPM/inifile', true) }}"

# Staging for system copy artifacts
system_copy_export_path: "/sapmnt/{{ sap_sid | lower }}/export"
system_copy_gcs_bucket: "{{ gcp_project }}-sap-migration"
system_copy_gcs_prefix: "{{ migration_name }}/{{ sap_sid | lower }}"

# Feature flags
sap_migration_dry_run: false
sap_migration_skip_decommission: true

# RHEL for SAP images on GCP (update per GCP SAP OS support matrix)
gcp_rhel_sap_images:
  rhel-8: "projects/rhel-sap-cloud/global/images/family/rhel-8-8-sap-ha"
  rhel-9: "projects/rhel-sap-cloud/global/images/family/rhel-9-2-sap-ha"

gcp_default_image: "{{ gcp_rhel_sap_images['rhel-9'] }}"

# Firewall tags for SAP (see GoogleCloudPlatform/sap-deployment-automation)
gcp_sap_firewall_tags:
  sap-allow-all:
    - "22"
    - "1128-1129"
    - "3200-3299"
    - "3600-3699"
    - "3900-3999"
    - "4300-4399"
    - "50000-50200"
    - "5400-5499"
    - "8100-8199"
