---
# IBM Db2 distributed + HA cluster topology (ECC / NetWeaver AnyDB)

sap_ha_cluster_enabled: true
sap_database_type: db2

# Demo sizes — fit within GCP free-tier 250GB SSD quota per region
# Production: db2_primary/secondary n2-highmem-16 with 512GB data + 256GB log
sap_cluster_nodes:
  db2_primary:
    role: db2_primary
    machine_type: e2-standard-4
    data_disk_gb: 50
    log_disk_gb: 30
  db2_secondary:
    role: db2_secondary
    machine_type: e2-standard-4
    data_disk_gb: 50
    log_disk_gb: 30
  ascs:
    role: ascs
    machine_type: e2-standard-2
    data_disk_gb: 20
  ers:
    role: ers
    machine_type: e2-standard-2
    data_disk_gb: 20
  aas:
    role: aas
    machine_type: e2-standard-2
    data_disk_gb: 20

sap_cluster_vips:
  db2_vip: 10.20.0.10
  nw_vip: 10.20.0.11

sap_db2_instance: db2inst1
sap_db2_port: 50000
sap_db2_database: "{{ sap_sid }}"
sap_db2_hadr_enabled: true
sap_db2_export_path: "/db2/{{ sap_db2_instance }}/export"

sap_pacemaker_fence_agent: fence_gce
sap_pacemaker_fence_options: "project={{ gcp_project }}"

system_copy_export_path: "{{ sap_db2_export_path }}"
system_copy_export_method: db2_online_backup
system_copy_import_method: db2_restore

sap_stop_order:
  - aas
  - ers
  - ascs
  - db2_secondary
  - db2_primary
