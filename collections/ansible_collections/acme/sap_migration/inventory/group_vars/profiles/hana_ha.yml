---
# SAP HANA distributed + HA cluster topology (S/4HANA)

sap_ha_cluster_enabled: true
sap_database_type: hana

# Demo sizes — fit within GCP free-tier 250GB SSD quota per region
# Production: hana_primary/secondary n2-highmem-32 with 512GB data + 256GB log
sap_cluster_nodes:
  hana_primary:
    role: hana_primary
    machine_type: n2-standard-4
    data_disk_gb: 50
    log_disk_gb: 30
  hana_secondary:
    role: hana_secondary
    machine_type: n2-standard-4
    data_disk_gb: 50
    log_disk_gb: 30
  ascs:
    role: ascs
    machine_type: n2-standard-2
    data_disk_gb: 20
  ers:
    role: ers
    machine_type: n2-standard-2
    data_disk_gb: 20
  aas:
    role: aas
    machine_type: n2-standard-2
    data_disk_gb: 20

sap_cluster_vips:
  hana_vip: 10.20.0.10
  nw_vip: 10.20.0.11

sap_hsr_mode: syncmem
sap_hsr_operation_mode: logreplay

system_copy_export_method: swpm_homogeneous
system_copy_import_method: swpm_homogeneous

sap_stop_order:
  - aas
  - ers
  - ascs
  - hana_secondary
  - hana_primary
