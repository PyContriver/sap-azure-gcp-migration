---
- name: Validate Db2 is running on GCP primary
  ansible.builtin.command:
    argv:
      - db2
      - list active databases
  become: true
  become_user: "{{ sap_db2_instance }}"
  register: db2_active_dbs
  changed_when: false
  failed_when: db2_active_dbs.rc != 0
  when:
    - sap_database_type == 'db2'
    - sap_node_role == 'db2_primary'

- name: Validate HANA is running on GCP primary
  ansible.builtin.command:
    argv:
      - sapcontrol
      - -nr
      - "{{ sap_hana_instance_nr }}"
      - -function
      - GetProcessList
  become: true
  become_user: "{{ sap_sid | lower }}adm"
  register: hana_process_list
  changed_when: false
  failed_when: hana_process_list.rc != 0
  when: sap_database_type == 'hana'

- name: Validate Pacemaker cluster status
  ansible.builtin.command:
    argv:
      - pcs
      - status
  become: true
  register: pcs_status
  changed_when: false
  when: sap_ha_cluster_enabled | bool

- name: Update /etc/hosts with production VIP mappings on all GCP nodes
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ item.value }}\\s"
    line: "{{ item.value }} {{ sap_sid | lower }} {{ sap_sid | lower }}.{{ sap_domain }}"
    state: present
  become: true
  loop: "{{ sap_cluster_vips | dict2items }}"
  when: sap_ha_cluster_enabled | bool

- name: Update internal DNS record for SAP hostname (when DNS server defined)
  community.general.nsupdate:
    key_name: "{{ cutover_dns_key_name | default(omit) }}"
    key_secret: "{{ cutover_dns_key_secret | default(omit) }}"
    server: "{{ cutover_dns_server }}"
    zone: "{{ sap_domain }}"
    record: "{{ sap_sid | lower }}.{{ sap_domain }}"
    type: A
    value: "{{ sap_cluster_vips.nw_vip }}"
    ttl: "{{ cutover_dns_ttl }}"
  when: cutover_dns_server is defined

- name: Run SAP smoke test via sapcontrol
  ansible.builtin.command:
    argv:
      - sapcontrol
      - -nr
      - "{{ sap_instance_nr }}"
      - -function
      - GetSystemInstanceList
  become: true
  become_user: "{{ sap_sid | lower }}adm"
  register: sap_instance_list
  changed_when: false

- name: Persist cutover completion
  ansible.builtin.set_stats:
    data:
      sap_cutover_complete: true
      sap_cutover_timestamp: "{{ ansible_date_time.iso8601 }}"
    aggregate: false

- name: Display cutover summary
  ansible.builtin.debug:
    msg:
      - "SAP system {{ sap_sid }} cutover validation complete"
      - "HANA processes: {{ hana_process_list.stdout_lines | default([]) | length }} lines"
      - "NW instances: {{ sap_instance_list.stdout_lines | default([]) | length }} lines"
