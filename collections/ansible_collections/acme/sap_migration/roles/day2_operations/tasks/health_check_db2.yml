---
- name: Db2 database health on primary
  ansible.builtin.command:
    argv:
      - db2
      - connect to
      - "{{ sap_db2_database }}"
  become: true
  become_user: "{{ sap_db2_instance }}"
  register: day2_db2_connect
  changed_when: false
  failed_when: false
  when: sap_node_role == 'db2_primary'

- name: Db2 HADR status on primary
  ansible.builtin.command:
    argv:
      - db2pd
      - -db
      - "{{ sap_db2_database }}"
      - -hadr
  become: true
  become_user: "{{ sap_db2_instance }}"
  register: day2_db2_hadr
  changed_when: false
  failed_when: false
  when:
    - sap_db2_hadr_enabled | default(true) | bool
    - sap_node_role == 'db2_primary'

- name: Merge Db2 health into report
  ansible.builtin.set_fact:
    day2_health_report: "{{ day2_health_report | default({}) | combine({
      'db2_ok': day2_db2_connect is not skipped and day2_db2_connect.rc | default(1) == 0,
      'db2_hadr_ok': day2_db2_hadr is not skipped and 'PEER' in (day2_db2_hadr.stdout | default(''))
    }) }}"
  when: sap_database_type == 'db2'
